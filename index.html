<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SONIWIYU LumFile</title></head>
<body><p>Menghubungkan ke LumFile...</p>
<script>
(async()=>{
 try {
  const r=await fetch("https://raw.githubusercontent.com/soniserver/soniserver.github.io/main/current.txt?t="+Date.now(),{cache:"no-store"});
  const u=(await r.text()).trim();
  if(/^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/i.test(u)) location.replace(u);
  else document.body.innerHTML="URL LumFile belum tersedia. Coba lagi sebentar.";
 } catch(e) { document.body.innerHTML="Belum bisa mengambil URL LumFile. Muat ulang halaman."; }
})();
</script></body></html>
